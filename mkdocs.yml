site_name: Nutrio Docs
site_description: Product, API, architecture, and deployment documentation for the Nutrio nutrition tracker.
site_url: https://liena-grytsyna.github.io/nutrio/
repo_url: https://github.com/liena-grytsyna/nutrio
repo_name: liena-grytsyna/nutrio

nav:
  - Overview: index.md
  - User Guide:
      - Overview: user/index.md
      - Using Nutrio: user/guide.md
  - Developer Guide:
      - Overview: developer/index.md
      - Quick Start: developer/getting-started.md
      - Architecture: developer/architecture.md
      - API Reference: developer/api.md
      - Deployment: developer/deployment.md
      - Troubleshooting: developer/troubleshooting.md

theme:
  name: material
  language: en
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/liena-grytsyna/nutrio
      name: GitHub repository
    - icon: material/web
      link: https://nutrio.it4.iktim.no/
      name: Live application

copyright: Copyright 2026 Nutrio
