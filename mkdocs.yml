site_name: Nutrio Docs
site_description: User and developer documentation for Nutrio.
site_url: https://liena-grytsyna.github.io/nutrio/
repo_url: https://github.com/liena-grytsyna/nutrio
repo_name: liena-grytsyna/nutrio

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - User Guide:
      - Overview: user/index.md
      - Using Nutrio: user/guide.md
  - Developer Guide:
      - Overview: developer/index.md
      - Quick Start: developer/getting-started.md
      - Architecture: developer/architecture.md
      - API Reference: developer/api.md
      - Deployment: developer/deployment.md
      - Troubleshooting: developer/troubleshooting.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
